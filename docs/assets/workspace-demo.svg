<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Your workspace, ready again.</title>
  <desc id="desc">Opening the Design workspace restores the browser and notes tab group, Files, and Terminal in their saved positions. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .restore-main { animation:restore-main 12s ease-in-out infinite; }
    .restore-side { animation:restore-side 12s ease-in-out infinite; }
    .restore-last { animation:restore-last 12s ease-in-out infinite; }
    .open-path { animation:open 12s ease-in-out infinite; }
    @keyframes restore-main { 0%,15%,100% { opacity:0; transform:translateY(18px); } 28%,88% { opacity:1; transform:translateY(0); } }
    @keyframes restore-side { 0%,23%,100% { opacity:0; transform:translateY(18px); } 36%,88% { opacity:1; transform:translateY(0); } }
    @keyframes restore-last { 0%,31%,100% { opacity:0; transform:translateY(18px); } 44%,88% { opacity:1; transform:translateY(0); } }
    @keyframes open { 0%,15%,100% { opacity:.2; } 24%,80% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Your workspace, ready again.</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >Reopen a saved desktop with its windows and tab groups.</text>
    <g transform="translate(48 160)"><rect x="0" y="0" width="258" height="288" rx="24" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="256" height="286" rx="23" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="22" y="35" font-size="12" fill="#ffffff8c" font-weight="600" letter-spacing="1.5">WORKSPACES</text><g ><rect x="14" y="58" width="230" height="129" rx="14" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="15" y="59" width="228" height="127" rx="13" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="29" y="87" font-size="19" fill="#ffffffeb" font-weight="600" >Design</text><text x="29" y="111" font-size="13" fill="#ffffff8c" font-weight="400" >4 windows · 1 tab group</text><rect x="29" y="130" width="68" height="37" rx="5" fill="#4c8dff" fill-opacity=".55"/><rect x="102" y="130" width="56" height="37" rx="5" fill="#ffffff" fill-opacity=".22"/><rect x="14" y="199" width="230" height="46" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".1"/><text x="29" y="228" font-size="16" fill="#ffffff8c" font-weight="400" >Reading</text></g><path class="open-path" d="M316 300H355M344 291L355 300L344 309" fill="none" stroke="#9cc0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(372 145)"><rect x="0" y="0" width="700" height="320" rx="24" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="698" height="318" rx="23" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="22" y="29" font-size="15" fill="#ffffffeb" font-weight="500" >Design</text><text x="676" y="29" font-size="12" fill="#ffffff8c" font-weight="400" text-anchor="end">Desktop</text><g transform="translate(18 49)"><g class="restore-main"><rect x="0" y="0" width="367" height="30" rx="15" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="365" height="28" rx="14" fill="none" stroke="url(#rim)" stroke-width="1.2"/><g ><rect x="4" y="4" width="171" height="22" rx="11" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="5" y="5" width="169" height="20" rx="10" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="18" y="20" font-size="12" fill="#ffffffeb" font-weight="500" >Browser</text><text x="199" y="20" font-size="12" fill="#ffffff8c" font-weight="400" >Notes</text><g transform="translate(0 37)"><rect x="0" y="0" width="367" height="213" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Reference</text><path d="M1 44H366" stroke="#ffffff" stroke-opacity=".08"/><text x="20" y="81" font-size="22" fill="#ffffffeb" font-weight="600" >Start where you left off.</text><rect x="20" y="106" width="283" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="20" y="127" width="246" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="20" y="148" width="276" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="20" y="169" width="182" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g></g></g><g transform="translate(401 49)"><g class="restore-side"><rect x="0" y="0" width="281" height="146" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Files</text><path d="M1 44H280" stroke="#ffffff" stroke-opacity=".08"/><rect x="16" y="58" width="16" height="12" rx="3" fill="#4c8dff" fill-opacity=".8"/><text x="43" y="69" font-size="13" fill="#ffffff8c" font-weight="400" >Research</text><rect x="16" y="85" width="16" height="12" rx="3" fill="#4c8dff" fill-opacity=".8"/><text x="43" y="96" font-size="13" fill="#ffffff8c" font-weight="400" >Sketches</text><rect x="16" y="112" width="16" height="12" rx="3" fill="#4c8dff" fill-opacity=".8"/><text x="43" y="123" font-size="13" fill="#ffffff8c" font-weight="400" >References</text></g></g><g transform="translate(401 211)"><g class="restore-last"><rect x="0" y="0" width="281" height="88" rx="12" fill="#11131a" stroke="#ffffff" stroke-opacity=".14"/><text x="17" y="28" font-size="13" fill="#ffffff8c" font-weight="500" >Terminal</text><text x="17" y="59" font-size="16" fill="#6fd6a8" font-weight="400" >› ready</text></g></g></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="132" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="67.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="144" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="169.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">W</text><rect x="204" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="205" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="230.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">1</text><text x="291" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Open a workspace. Restore its layout.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
