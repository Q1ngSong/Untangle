<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Menu bar icons, in rows.</title>
  <desc id="desc">Choosing row 2 in the tray replaces the visible menu bar icons with that row, next to the notch. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .pick { animation:pick 9s ease-in-out infinite; }
    .bar1 { animation:bar1 9s ease-in-out infinite; }
    .bar2 { opacity:0; animation:bar2 9s ease-in-out infinite; }
    @keyframes pick { 0%,30%,92%,100% { transform:translateY(0); } 40%,84% { transform:translateY(62px); } }
    @keyframes bar1 { 0%,36%,92%,100% { opacity:1; } 44%,84% { opacity:0; } }
    @keyframes bar2 { 0%,36%,92%,100% { opacity:0; } 44%,84% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Menu bar icons, in rows.</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >Sort icons into rows so the notch never hides them (Beta).</text>
    <rect x="110" y="130" width="900" height="340" rx="22" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".12"/><path d="M132 130H988Q1010 130 1010 152V168H110V152Q110 130 132 130Z" fill="#ffffff" fill-opacity=".07"/><rect x="500" y="130" width="120" height="30" rx="12" fill="#000000" /><g class="bar1"><rect x="780" y="138" width="24" height="24" rx="6" fill="#4c8dff" fill-opacity=".9"/><rect x="820" y="138" width="24" height="24" rx="6" fill="#f5c04a" fill-opacity=".9"/><rect x="860" y="138" width="24" height="24" rx="6" fill="#63c890" fill-opacity=".9"/><rect x="900" y="138" width="24" height="24" rx="6" fill="#ff5f57" fill-opacity=".9"/></g><g class="bar2"><rect x="780" y="138" width="24" height="24" rx="6" fill="#c99bff" fill-opacity=".9"/><rect x="820" y="138" width="24" height="24" rx="6" fill="#6fd6ff" fill-opacity=".9"/><rect x="860" y="138" width="24" height="24" rx="6" fill="#fa4b6a" fill-opacity=".9"/><rect x="900" y="138" width="24" height="24" rx="6" fill="#ffffff" fill-opacity=".9"/></g><rect x="620" y="190" width="360" height="250" rx="24" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="621" y="191" width="358" height="248" rx="23" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="646" y="226" font-size="15" fill="#ffffff8c" font-weight="600" >Menu bar · 1–9 to pick a row</text><g class="pick"><rect x="636" y="244" width="328" height="56" rx="16" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="637" y="245" width="326" height="54" rx="15" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="660" y="280" font-size="20" fill="#ffffffeb" font-weight="600" >1</text><rect x="700" y="258" width="28" height="28" rx="7" fill="#4c8dff" fill-opacity=".9"/><rect x="744" y="258" width="28" height="28" rx="7" fill="#f5c04a" fill-opacity=".9"/><rect x="788" y="258" width="28" height="28" rx="7" fill="#63c890" fill-opacity=".9"/><rect x="832" y="258" width="28" height="28" rx="7" fill="#ff5f57" fill-opacity=".9"/><text x="660" y="342" font-size="20" fill="#ffffffeb" font-weight="600" >2</text><rect x="700" y="320" width="28" height="28" rx="7" fill="#c99bff" fill-opacity=".9"/><rect x="744" y="320" width="28" height="28" rx="7" fill="#6fd6ff" fill-opacity=".9"/><rect x="788" y="320" width="28" height="28" rx="7" fill="#fa4b6a" fill-opacity=".9"/><rect x="832" y="320" width="28" height="28" rx="7" fill="#ffffff" fill-opacity=".9"/><text x="660" y="404" font-size="20" fill="#ffffffeb" font-weight="600" >3</text><rect x="700" y="382" width="28" height="28" rx="7" fill="#ffb547" fill-opacity=".9"/><rect x="744" y="382" width="28" height="28" rx="7" fill="#3aa0ff" fill-opacity=".9"/><rect x="788" y="382" width="28" height="28" rx="7" fill="#8fe0b0" fill-opacity=".9"/><rect x="832" y="382" width="28" height="28" rx="7" fill="#c9b7c4" fill-opacity=".9"/><g transform="translate(150 200)"><rect x="0" y="0" width="420" height="240" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Browser</text><path d="M1 44H419" stroke="#ffffff" stroke-opacity=".08"/></g><g transform="translate(48 512)"><rect x="0" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="26.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">⌥</text><rect x="61" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="62" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="87.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">M</text><text x="129" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Open the tray, pick a row, and those icons show.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
