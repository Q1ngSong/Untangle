<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Find the window you need.</title>
  <desc id="desc">The window switcher lists each window as a card; the selection moves from the browser to the second Notes window. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .pick { animation:pick 9s ease-in-out infinite; }
    @keyframes pick { 0%,20%,100% { transform:translateX(0); } 32%,52% { transform:translateX(216px); } 64%,88% { transform:translateX(432px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Find the window you need.</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >Switch windows across apps, with live thumbnails.</text>
    <g transform="translate(110 168)" filter="url(#shadow)"><rect x="0" y="0" width="900" height="262" rx="30" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="898" height="260" rx="29" fill="none" stroke="url(#rim)" stroke-width="1.2"/><g class="pick"><rect x="18" y="18" width="204" height="226" rx="20" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="19" y="19" width="202" height="224" rx="19" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="38" y="50" font-size="15" fill="#ffffffeb" font-weight="600" >Browser</text><g transform="translate(30 66)"><rect x="0" y="0" width="180" height="150" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Library</text><path d="M1 44H179" stroke="#ffffff" stroke-opacity=".08"/><rect x="16" y="64" width="120" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="82" width="140" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="100" width="96" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g><text x="254" y="50" font-size="15" fill="#ffffffeb" font-weight="600" >Notes</text><g transform="translate(246 66)"><rect x="0" y="0" width="180" height="150" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Today</text><path d="M1 44H179" stroke="#ffffff" stroke-opacity=".08"/><rect x="16" y="64" width="120" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="82" width="140" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="100" width="96" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g><text x="470" y="50" font-size="15" fill="#ffffffeb" font-weight="600" >Notes</text><g transform="translate(462 66)"><rect x="0" y="0" width="180" height="150" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Meeting</text><path d="M1 44H179" stroke="#ffffff" stroke-opacity=".08"/><rect x="16" y="64" width="120" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="82" width="140" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="100" width="96" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g><text x="686" y="50" font-size="15" fill="#ffffffeb" font-weight="600" >Files</text><g transform="translate(678 66)"><rect x="0" y="0" width="180" height="150" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Research</text><path d="M1 44H179" stroke="#ffffff" stroke-opacity=".08"/><rect x="16" y="64" width="120" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="82" width="140" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="16" y="100" width="96" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g></g><g transform="translate(48 512)"><rect x="0" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="26.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">⌘</text><rect x="61" y="0" width="58" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="62" y="1" width="56" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="90.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">Tab</text><text x="129" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Every window, not just every app.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
