<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Desktops without Mission Control.</title>
  <desc id="desc">Three of six desktops are empty; they disappear and the remaining desktops move together. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .desk { animation:10s ease-in-out infinite; }
    .d1, .d3, .d4 { animation-name:gone; }
    .d2 { animation-name:close2; } .d5 { animation-name:close5; }
    @keyframes gone { 0%,24%,92%,100% { opacity:1; transform:none; } 36%,84% { opacity:0; transform:translateY(-16px) scale(.96); } }
    @keyframes close2 { 0%,36%,92%,100% { transform:none; } 50%,84% { transform:translateX(-170px); } }
    @keyframes close5 { 0%,36%,92%,100% { transform:none; } 50%,84% { transform:translateX(-510px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Desktops without Mission Control.</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >Create, switch, send windows and clean up from the keyboard.</text>
    <g class="desk d0"><rect x="60" y="220" width="150" height="110" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/><rect x="76" y="254" width="70" height="50" rx="6" fill="url(#window)" stroke="#ffffff" stroke-opacity=".22"/><rect x="124" y="280" width="66" height="48" rx="6" fill="url(#window)" stroke="#ffffff" stroke-opacity=".22"/><text x="135" y="360" font-size="15" fill="#ffffff8c" font-weight="500" text-anchor="middle">Desktop 1</text></g><g class="desk d1"><rect x="230" y="220" width="150" height="110" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/><text x="305" y="282" font-size="16" fill="#ffffff59" font-weight="500" text-anchor="middle">Empty</text><text x="305" y="360" font-size="15" fill="#ffffff8c" font-weight="500" text-anchor="middle">Desktop 2</text></g><g class="desk d2"><rect x="400" y="220" width="150" height="110" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/><rect x="420" y="250" width="100" height="70" rx="6" fill="url(#window)" stroke="#ffffff" stroke-opacity=".22"/><text x="475" y="360" font-size="15" fill="#ffffff8c" font-weight="500" text-anchor="middle">Desktop 3</text></g><g class="desk d3"><rect x="570" y="220" width="150" height="110" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/><text x="645" y="282" font-size="16" fill="#ffffff59" font-weight="500" text-anchor="middle">Empty</text><text x="645" y="360" font-size="15" fill="#ffffff8c" font-weight="500" text-anchor="middle">Desktop 4</text></g><g class="desk d4"><rect x="740" y="220" width="150" height="110" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/><text x="815" y="282" font-size="16" fill="#ffffff59" font-weight="500" text-anchor="middle">Empty</text><text x="815" y="360" font-size="15" fill="#ffffff8c" font-weight="500" text-anchor="middle">Desktop 5</text></g><g class="desk d5"><rect x="910" y="220" width="150" height="110" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/><rect x="924" y="260" width="60" height="54" rx="6" fill="url(#window)" stroke="#ffffff" stroke-opacity=".22"/><rect x="980" y="246" width="60" height="44" rx="6" fill="url(#window)" stroke="#ffffff" stroke-opacity=".22"/><text x="985" y="360" font-size="15" fill="#ffffff8c" font-weight="500" text-anchor="middle">Desktop 6</text></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="132" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="67.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="144" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="169.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">D</text><rect x="204" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="205" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="230.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">C</text><text x="291" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Clean up every empty desktop at once.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
