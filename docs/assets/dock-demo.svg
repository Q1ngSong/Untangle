ill-opacity=".16"/><rect x="18" y="92" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="96" width="96" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="18" y="118" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="122" width="82" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="18" y="144" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="148" width="68" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g><g transform="translate(668 194)"><rect x="0" y="0" width="180" height="230" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >To-do</text><path d="M1 44H179" stroke="#ffffff" stroke-opacity=".08"/><rect x="18" y="66" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="70" width="110" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="18" y="92" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="96" width="96" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="18" y="118" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="122" width="82" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/><rect x="18" y="144" width="14" height="14" rx="4" fill="none" stroke="#f5c04a" stroke-width="1.6"/><rect x="42" y="148" width="68" height="5" rx="2" fill="#ffffff" fill-opacity=".16"/></g><g class="pick"><rect x="262" y="166" width="200" height="272" rx="18" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="263" y="167" width="198" height="270" rx="17" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="282" y="186" font-size="13" fill="#ffffff8c" font-weight="600" >Notes · 3 windows</text></g><rect x="330" y="480" width="460" height="76" rx="22" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="331" y="481" width="458" height="74" rx="21" fill="none" stroke="url(#rim)" stroke-width="1.2"/><rect x="342" y="492" width="52" height="52" rx="13.52" fill="#4c8dff" stroke="#ffffff" stroke-opacity=".18"/><rect x="406" y="492" width="52" height="52" rx="13.52" fill="#f5c04a" stroke="#ffffff" stroke-opacity=".18"/><rect x="470" y="492" width="52" height="52" rx="13.52" fill="#2f7de1" stroke="#ffffff" stroke-opacity=".18"/><rect x="534" y="492" width="52" height="52" rx="13.52" fill="#2b2f3a" stroke="#ffffff" stroke-opacity=".18"/><rect x="598" y="492" width="52" height="52" rx="13.52" fill="#3aa0ff" stroke="#ffffff" stroke-opacity=".18"/><rect x="662" y="492" width="52" height="52" rx="13.52" fill="#5aa7ff" stroke="#ffffff" stroke-opacity=".18"/><rect x="726" y="492" width="52" height="52" rx="13.52" fill="#fa4b6a" stroke="#ffffff" stroke-opacity=".18"/><use href="#cursor" x="476" y="512" width="24" height="30"/>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
