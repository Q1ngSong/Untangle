<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Search instead of remembering.</title>
  <desc id="desc">Typing lh in command search lists Left half first, then a window and a board whose names match. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .caret { animation:blink 1s steps(1) infinite; }
    .row { opacity:0; animation:9s ease-out infinite; }
    .row0 { animation-name:r0; } .row1 { animation-name:r1; } .row2 { animation-name:r2; }
    @media (prefers-reduced-motion: reduce) { .row { opacity:1; } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes r0 { 0%,12%,94%,100% { opacity:0; transform:translateY(8px); } 20%,88% { opacity:1; transform:none; } }
    @keyframes r1 { 0%,18%,94%,100% { opacity:0; transform:translateY(8px); } 26%,88% { opacity:1; transform:none; } }
    @keyframes r2 { 0%,24%,94%,100% { opacity:0; transform:translateY(8px); } 32%,88% { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Search instead of remembering.</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >Commands, open windows and saved boards, by name or initials.</text>
    <g transform="translate(200 124)"><rect x="0" y="0" width="720" height="360" rx="28" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="718" height="358" rx="27" fill="none" stroke="url(#rim)" stroke-width="1.2"/><rect x="20" y="20" width="680" height="64" rx="18" fill="#ffffff" fill-opacity=".07"/><circle cx="54" cy="51" r="11" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2.4"/><path d="M62 59L70 67" stroke="#ffffff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/><text x="86" y="61" font-size="28" fill="#ffffffeb" font-weight="500" >lh</text><rect class="caret" x="117" y="36" width="2" height="32" fill="#4c8dff"/><g class="row row0"><g ><rect x="18" y="104" width="684" height="70" rx="18" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="19" y="105" width="682" height="68" rx="17" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="52" y="148" font-size="24" fill="#ffffffeb" font-weight="600" >Left half</text><text x="676" y="147" font-size="18" fill="#ffffff8c" font-weight="500" text-anchor="end">←</text></g><g class="row row1"><text x="52" y="230" font-size="24" fill="#ffffff8c" font-weight="500" >Library — Browser</text><text x="676" y="229" font-size="18" fill="#ffffff8c" font-weight="500" text-anchor="end">window</text></g><g class="row row2"><text x="52" y="312" font-size="24" fill="#ffffff8c" font-weight="500" >Lighthouse board</text><text x="676" y="311" font-size="18" fill="#ffffff8c" font-weight="500" text-anchor="end">board</text></g></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="132" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="67.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="82" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="144" y="1" width="80" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="184.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">Space</text><text x="240" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Find commands, windows and boards; pinyin works too.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
