<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Untangle — Your windows. In place.</title>
  <desc id="desc">A native macOS window manager. On a small desktop, four overlapping windows slide into a left half, two right quarters and a tab group.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
    <clipPath id="screen"><rect x="650" y="46" width="500" height="328" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .win { transform-box:fill-box; transform-origin:center; animation:8s ease-in-out infinite; }
    .docs { animation-name:docs; } .browser { animation-name:browser; }
    .notes { animation-name:notes; } .terminal { animation-name:terminal; }
    .tabs { animation:tabs 8s ease-in-out infinite; }
    @keyframes docs { 0%,16%,94%,100% { transform:translate(176px,-6px) rotate(5deg) scale(.86); } 38%,80% { transform:none; } }
    @keyframes browser { 0%,16%,94%,100% { transform:translate(70px,34px) rotate(-6deg) scale(.9); } 34%,80% { transform:none; } }
    @keyframes notes { 0%,16%,94%,100% { transform:translate(-170px,96px) rotate(4deg); } 30%,80% { transform:none; } }
    @keyframes terminal { 0%,16%,94%,100% { transform:translate(-120px,-104px) rotate(-3deg); } 32%,80% { transform:none; } }
    @keyframes tabs { 0%,36%,86%,100% { opacity:0; } 44%,80% { opacity:1; } }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <text x="62" y="76" fill="#ffffff8c" font-size="12" font-weight="600" letter-spacing="3">NATIVE MACOS WINDOW MANAGER</text>
    <text x="57" y="190" fill="#ffffff" font-size="88" font-weight="650" letter-spacing="-5">Untangle</text>
    <text x="62" y="239" fill="#ffffffb3" font-size="26" font-weight="400" letter-spacing="-.5">Your windows. In place.</text>
    <path d="M63 294H99" stroke="#4c8dff" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="336" fill="#ffffff8c" font-size="12" font-weight="500" letter-spacing="1.9">LAYOUTS  /  TAB GROUPS  /  WORKSPACES</text>
    <rect x="650" y="46" width="500" height="328" rx="20" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".12"/>
    <g clip-path="url(#screen)">
      <rect x="650" y="46" width="500" height="18" rx="0" fill="#ffffff" fill-opacity=".05"/>
      <circle cx="668" cy="55" r="3" fill="#ffffff" fill-opacity=".45"/>
      <g class="win docs" filter="url(#shadow)"><g transform="translate(662 104)"><rect x="0" y="0" width="233" height="258" rx="10" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="13" cy="12" r="3" fill="#fc786e"/><circle cx="23" cy="12" r="3" fill="#efbe53"/><circle cx="33" cy="12" r="3" fill="#63c890"/><text x="44" y="16" font-size="10" fill="#ffffff8c" font-weight="500" >Docs</text><path d="M0 24H233" stroke="#ffffff" stroke-opacity=".08"/><rect x="12" y="38" width="140" height="5" rx="2.5" fill="#4c8dff" fill-opacity="0.7"/><rect x="12" y="53" width="150" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.22"/><rect x="12" y="68" width="180" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="83" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="98" width="160" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/></g></g><g class="win browser" filter="url(#shadow)"><g transform="translate(662 104)"><rect x="0" y="0" width="233" height="258" rx="10" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="13" cy="12" r="3" fill="#fc786e"/><circle cx="23" cy="12" r="3" fill="#efbe53"/><circle cx="33" cy="12" r="3" fill="#63c890"/><text x="44" y="16" font-size="10" fill="#ffffff8c" font-weight="500" >Browser</text><path d="M0 24H233" stroke="#ffffff" stroke-opacity=".08"/><rect x="12" y="38" width="170" height="5" rx="2.5" fill="#9cc0ff" fill-opacity="0.6"/><rect x="12" y="53" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="68" width="150" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.22"/><rect x="12" y="83" width="180" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="98" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="113" width="160" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/></g></g><g class="win notes" filter="url(#shadow)"><g transform="translate(905 72)"><rect x="0" y="0" width="233" height="140" rx="10" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="13" cy="12" r="3" fill="#fc786e"/><circle cx="23" cy="12" r="3" fill="#efbe53"/><circle cx="33" cy="12" r="3" fill="#63c890"/><text x="44" y="16" font-size="10" fill="#ffffff8c" font-weight="500" >Notes</text><path d="M0 24H233" stroke="#ffffff" stroke-opacity=".08"/><rect x="12" y="38" width="150" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.22"/><rect x="12" y="53" width="180" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="68" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/><rect x="12" y="83" width="160" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/></g></g><g class="win terminal" filter="url(#shadow)"><g transform="translate(905 222)"><rect x="0" y="0" width="233" height="140" rx="10" fill="#11131a" stroke="#ffffff" stroke-opacity=".14"/><circle cx="13" cy="12" r="3" fill="#fc786e"/><circle cx="23" cy="12" r="3" fill="#efbe53"/><circle cx="33" cy="12" r="3" fill="#63c890"/><text x="44" y="16" font-size="10" fill="#ffffff8c" font-weight="500" >Terminal</text><path d="M0 24H233" stroke="#ffffff" stroke-opacity=".08"/><rect x="12" y="38" width="70" height="5" rx="2.5" fill="#6fd6a8" fill-opacity="0.8"/><rect x="12" y="53" width="110" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/><rect x="12" y="68" width="90" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/></g></g>
      <g class="tabs"><rect x="662" y="72" width="233" height="26" rx="13" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="663" y="73" width="231" height="24" rx="12" fill="none" stroke="url(#rim)" stroke-width="1.2"/><g ><rect x="665" y="75" width="113" height="20" rx="10" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="666" y="76" width="111" height="18" rx="9" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><text x="721" y="89" font-size="10" fill="#ffffffeb" font-weight="600" text-anchor="middle">Browser</text><text x="836" y="89" font-size="10" fill="#ffffff8c" font-weight="500" text-anchor="middle">Docs</text></g>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="418.5" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
  </g>
</svg>
