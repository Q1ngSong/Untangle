<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Different apps. One tab group.</title>
  <desc id="desc">Clicking the Notes tab brings the notes window in front of the browser window within the same area. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .selected { animation:selection 10s ease-in-out infinite; }
    .browser { opacity:1; animation:browser 10s ease-in-out infinite; }
    .notes { opacity:0; animation:notes 10s ease-in-out infinite; }
    .pointer { transform:translate(544px,181px); animation:pointer 10s ease-in-out infinite; }
    .click { opacity:0; animation:click 10s ease-out infinite; }
    @keyframes selection { 0%,30%,100% { transform:translateX(0); } 38%,85% { transform:translateX(244px); } }
    @keyframes browser { 0%,30%,100% { opacity:1; } 38%,85% { opacity:0; } }
    @keyframes notes { 0%,30%,100% { opacity:0; } 38%,85% { opacity:1; } }
    @keyframes pointer { 0%,14%,92%,100% { transform:translate(620px,346px); opacity:0; } 23% { opacity:1; } 30%,80% { transform:translate(544px,181px); opacity:1; } }
    @keyframes click { 0%,30%,40%,100% { opacity:0; r:9px; } 32% { opacity:.8; r:9px; } 39% { opacity:0; r:25px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Different apps. One tab group.</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >Keep related windows together, then bring one to the front.</text>
    <g transform="translate(182 145)" filter="url(#shadow)"><g transform="translate(0 68)"><rect x="0" y="0" width="756" height="245" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Window in focus</text><path d="M1 44H755" stroke="#ffffff" stroke-opacity=".08"/><g class="browser"><text x="32" y="87" font-size="25" fill="#ffffffeb" font-weight="600" >Reference library</text><text x="32" y="115" font-size="16" fill="#ffffff8c" font-weight="400" >Articles, documentation, and a few open questions.</text><rect x="32" y="146" width="202" height="67" rx="9" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><rect x="46" y="163" width="150" height="5" rx="2" fill="#9cc0ff" fill-opacity=".6"/><rect x="46" y="180" width="124" height="5" rx="2" fill="#ffffff" fill-opacity=".2"/><rect x="254" y="146" width="218" height="67" rx="9" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><rect x="268" y="163" width="166" height="5" rx="2" fill="#9cc0ff" fill-opacity=".6"/><rect x="268" y="180" width="140" height="5" rx="2" fill="#ffffff" fill-opacity=".2"/><rect x="492" y="146" width="230" height="67" rx="9" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><rect x="506" y="163" width="178" height="5" rx="2" fill="#9cc0ff" fill-opacity=".6"/><rect x="506" y="180" width="152" height="5" rx="2" fill="#ffffff" fill-opacity=".2"/></g><g class="notes"><text x="32" y="87" font-size="25" fill="#ffffffeb" font-weight="600" >Notes for today</text><rect x="34" y="110" width="15" height="15" rx="4" fill="none" stroke="#ffffff8c" stroke-width="1.3"/><text x="65" y="122" font-size="17" fill="#ffffffb3" font-weight="400" >Bring the reference windows together</text><rect x="34" y="147" width="15" height="15" rx="4" fill="none" stroke="#ffffff8c" stroke-width="1.3"/><text x="65" y="159" font-size="17" fill="#ffffffb3" font-weight="400" >Choose a tab to focus its app</text><rect x="34" y="184" width="15" height="15" rx="4" fill="none" stroke="#ffffff8c" stroke-width="1.3"/><text x="65" y="196" font-size="17" fill="#ffffffb3" font-weight="400" >Keep the desktop in view</text></g></g><rect x="0" y="0" width="756" height="58" rx="29" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="754" height="56" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.2"/><g class="selected"><rect x="9" y="8" width="235" height="42" rx="21" fill="url(#lens-fill)" stroke="#000000" stroke-opacity=".35"/><rect x="10" y="9" width="233" height="40" rx="20" fill="none" stroke="url(#lens-rim)" stroke-width="1.4"/></g><rect x="35" y="22" width="14" height="14" rx="3" fill="none" stroke="#ffffff8c" stroke-width="1.5"/><text x="60" y="36" font-size="17" fill="#ffffffeb" font-weight="500" >Browser</text><rect x="279" y="22" width="14" height="14" rx="3" fill="none" stroke="#ffffff8c" stroke-width="1.5"/><text x="304" y="36" font-size="17" fill="#ffffffeb" font-weight="500" >Notes</text><rect x="524" y="22" width="14" height="14" rx="3" fill="none" stroke="#ffffff8c" stroke-width="1.5"/><text x="549" y="36" font-size="17" fill="#ffffffeb" font-weight="500" >Files</text></g><g class="pointer"><circle class="click" cx="0" cy="0" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><use href="#cursor" width="24" height="30"/></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="132" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="67.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="144" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="169.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">T</text><rect x="204" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="205" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="230.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">T</text><text x="291" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Group windows. Click a tab to focus.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
