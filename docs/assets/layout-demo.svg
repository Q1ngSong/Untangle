<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Untangle</title>
  <desc id="desc">A focused window resizes and moves to the left half of the desktop while Notes becomes visible on the right. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#1a1d27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#2a2f40" stop-opacity=".78"/><stop offset="1" stop-color="#161925" stop-opacity=".84"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".4"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/><stop offset=".7" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="lens-rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="lens-fill" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#262a37"/><stop offset="1" stop-color="#1c1f2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .focused { transform:translate(48px,150px); animation:place 10s ease-in-out infinite; }
    .resizing-frame { width:484px; animation:resize 10s ease-in-out infinite; }
    .companion { animation:reveal 10s ease-in-out infinite; }
    .snap-outline { opacity:0; animation:target 10s ease-in-out infinite; }
    @keyframes place { 0%,18%,100% { transform:translate(266px,161px); } 34%,82% { transform:translate(48px,150px); } }
    @keyframes resize { 0%,18%,100% { width:590px; } 34%,82% { width:484px; } }
    @keyframes reveal { 0%,22%,100% { opacity:0; transform:translateX(18px); } 40%,82% { opacity:1; transform:translateX(0); } }
    @keyframes target { 0%,16%,40%,100% { opacity:0; } 22%,31% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#night)"/>
    <text x="48" y="58" font-size="31" fill="#ffffffeb" font-weight="650" >Untangle</text>
    <text x="48" y="90" font-size="18" fill="#ffffff8c" font-weight="400" >A place for every window.</text>
    <defs><clipPath id="resizing-content"><rect class="resizing-frame" width="484" height="300" rx="16"/></clipPath></defs>
      <g transform="translate(578 150)"><g class="companion" filter="url(#shadow)"><rect x="0" y="0" width="484" height="300" rx="16" fill="url(#window)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Notes</text><path d="M1 44H483" stroke="#ffffff" stroke-opacity=".08"/><text x="28" y="84" font-size="24" fill="#ffffffeb" font-weight="600" >Room for the next idea</text><text x="28" y="111" font-size="14" fill="#ffffff8c" font-weight="400" >A few things worth keeping together.</text><rect x="28" y="137" width="296" height="6" rx="3" fill="#ffffff" fill-opacity=".16"/><rect x="28" y="157" width="348" height="6" rx="3" fill="#ffffff" fill-opacity=".16"/><rect x="28" y="177" width="254" height="6" rx="3" fill="#ffffff" fill-opacity=".16"/><rect x="28" y="215" width="6" height="46" rx="3" fill="#4c8dff" /><text x="48" y="234" font-size="17" fill="#9cc0ff" font-weight="500" >One desktop. A clearer view.</text><text x="48" y="257" font-size="14" fill="#ffffff8c" font-weight="400" >Keep the next step in sight.</text></g></g><g class="focused" filter="url(#shadow)"><rect x="0" y="0" width="484" height="300" rx="16" fill="url(#window)" class="resizing-frame" stroke="#ffffff" stroke-opacity=".14"/><g clip-path="url(#resizing-content)"><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#ffffff8c" font-weight="500" >Browser</text><path d="M0 44H650" stroke="#ffffff" stroke-opacity=".08"/><text x="28" y="84" font-size="24" fill="#ffffffeb" font-weight="600" >A little more space</text><text x="28" y="111" font-size="14" fill="#ffffff8c" font-weight="400" >A few things worth keeping together.</text><rect x="28" y="137" width="296" height="6" rx="3" fill="#ffffff" fill-opacity=".16"/><rect x="28" y="157" width="348" height="6" rx="3" fill="#ffffff" fill-opacity=".16"/><rect x="28" y="177" width="254" height="6" rx="3" fill="#ffffff" fill-opacity=".16"/><rect x="28" y="215" width="6" height="46" rx="3" fill="#4c8dff" /><text x="48" y="234" font-size="17" fill="#9cc0ff" font-weight="500" >One desktop. A clearer view.</text><text x="48" y="257" font-size="14" fill="#ffffff8c" font-weight="400" >Keep the next step in sight.</text></g></g><g class="snap-outline"><rect x="43" y="135" width="510" height="330" rx="24" fill="#ffffff" fill-opacity=".06" stroke="url(#lens-rim)" stroke-width="2"/></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="1" y="1" width="132" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="67.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="11" fill="url(#smoke)" stroke="#000000" stroke-opacity=".4" /><rect x="144" y="1" width="50" height="44" rx="10" fill="none" stroke="url(#rim)" stroke-width="1.2"/><text x="169.0" y="30" font-size="21" fill="#ffffffeb" font-weight="500" text-anchor="middle">←</text><text x="227" y="30" font-size="18" fill="#ffffffeb" font-weight="500" >Hold the leader. Place the window.</text></g>
    <text x="1072" y="588" font-size="11" fill="#ffffff59" font-weight="500" text-anchor="end" letter-spacing="1.4">UNTANGLE  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
  <rect x=".75" y=".75" width="1118.5" height="618.5" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
</svg>
